      if (value === null || value === undefined) return undefined;
      const text = String(value).trim();

      return text;

    function getRankingSlug(game) {

      const slugs = Array.isArray(game?.statsSlugs) && game.statsSlugs.length

          case "plays_asc":

          case "players_asc":

    async function waitForSupabaseSetup() {
      if (isKeyUnset || supabaseClient) return supabaseClient;

      if (document.readyState === "loading") {
        await new Promise((resolve) => {
          document.addEventListener("DOMContentLoaded", resolve, { once: true });
        });
      } else {
        await new Promise((resolve) => window.setTimeout(resolve, 0));
      }

      if (!supabaseClient) setupSupabase();
      return supabaseClient;
    }

    async function fetchSingleGameStats(slug) {
      const normalizedSlug = cleanText(slug);
      if (!normalizedSlug) return { totalPlayCount: 0, playerCount: 0 };
      if (singleStatsCache.has(normalizedSlug)) return singleStatsCache.get(normalizedSlug);

      await waitForSupabaseSetup();

      if (isKeyUnset || !supabaseClient) {
        const emptyStats = { totalPlayCount: 0, playerCount: 0 };
        singleStatsCache.set(normalizedSlug, emptyStats);
        return emptyStats;
      }

      try {
        const { data, error } = await supabaseClient.rpc("get_game_play_stats", {
          p_game_slug: normalizedSlug
        });

        if (error) throw error;

        const row = Array.isArray(data) && data.length > 0 ? data[0] : null;
        const stats = normalizeStats(row);
        singleStatsCache.set(normalizedSlug, stats);
        return stats;
      } catch (error) {
        console.error("get_game_play_stats error:", normalizedSlug, error);
        const emptyStats = { totalPlayCount: 0, playerCount: 0 };
        singleStatsCache.set(normalizedSlug, emptyStats);
        return emptyStats;
      }
    }

    async function fetchGameStats(game) {
      if (!game) return { totalPlayCount: 0, playerCount: 0 };
      if (gameStatsCache.has(game.slug)) return gameStatsCache.get(game.slug);

      const slugs = getStatsSlugs(game);
      const statsList = await Promise.all(slugs.map((slug) => fetchSingleGameStats(slug)));
      const stats = statsList.reduce(
        (total, item) => {
          total.totalPlayCount += Number(item?.totalPlayCount || 0);
          total.playerCount += Number(item?.playerCount || 0);
          return total;
        },
        { totalPlayCount: 0, playerCount: 0 }
      );

      gameStatsCache.set(game.slug, stats);
      return stats;
    }

    function applyStatsToCard(game, stats) {
      const playsEl = document.getElementById(`plays-${game.slug}`);
      const playersEl = document.getElementById(`players-${game.slug}`);
      const playsBox = document.getElementById(`plays-box-${game.slug}`);
      const playersBox = document.getElementById(`players-box-${game.slug}`);

      if (!playsEl || !playersEl) return false;

      const totalPlayCount = Number(stats?.totalPlayCount || 0);
      const playerCount = Number(stats?.playerCount || 0);

      if (totalPlayCount <= 0 && playerCount <= 0) {
        setStatsComingSoon(game);

      playsEl.textContent = `${formatNumber(totalPlayCount)}回`;
      playersEl.textContent = `${formatNumber(playerCount)}人`;
      playsEl.classList.remove("coming");
      playersEl.classList.remove("coming");
      if (playsBox) playsBox.classList.remove("coming");
      if (playersBox) playersBox.classList.remove("coming");
      return true;
    }

      const image = document.getElementById("diagnosisBannerImage");

      const start = () => {
        const loadImage = () => {
          const src = image.dataset.lazySrc;
          if (!src || image.getAttribute("src")) return;

          image.addEventListener(
            "load",
            () => {
              image.classList.add("loaded");
            },
            { once: true }
          );
          image.setAttribute("src", src);
        };

        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(loadImage, { timeout: 1800 });
        } else {
          window.setTimeout(loadImage, 900);
        }
      };

      if (document.readyState === "complete") {
        start();
      } else {
        window.addEventListener("load", start, { once: true });

      const fallback = {
        ...game,
        scoreScale: Number(game.scoreScale || 1),
        scoreDecimals: Number(game.scoreDecimals || 0)
      };

      if (isKeyUnset) return fallback;

      await waitForSupabaseSetup();

      if (!supabaseClient) return fallback;

      try {
        const { data, error } = await supabaseClient
          .from("games")
          .select("game_slug, score_order, score_unit, score_scale, score_decimals, score_label, first_score_label, best_score_label")
          .eq("game_slug", getRankingSlug(game))
          .eq("is_active", true)
          .maybeSingle();

        if (error || !data) {
          if (error) console.warn("games metadata load error:", error);
          return fallback;
        }

        return {
          ...fallback,
          ...normalizeGameMetadata(data)
        };
      } catch (error) {
        console.warn("games metadata load failed:", error);
        return fallback;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatNumber(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return "0";
      return num.toLocaleString("ja-JP");
    }

    function maronHikouScoreText(numericScore) {
      const waveCode = Math.floor(numericScore / 10000000);
      const subScore = numericScore % 10000000;
      if (waveCode >= 31) {
        return `30波突破 / ${formatNumber(subScore)}点`;
      }
      return `${formatNumber(waveCode)}波到達 / ${formatNumber(subScore)}点`;
    }

    const UCHIKAERU_RANK_BASE = 2000000;

    function uchikaeruScoreText(numericScore) {
      const raw = Math.max(0, Math.floor(Number(numericScore) || 0));
      const clearWave = Math.floor(raw / UCHIKAERU_RANK_BASE);
      const detailScore = raw % UCHIKAERU_RANK_BASE;
      return `${formatNumber(clearWave)}波クリア / ${formatNumber(detailScore)}点`;
    }

    function scoreText(score, gameOrUnit) {
      if (score === null || score === undefined || score === "") return "—";

      const numericScore = Number(score);
      if (!Number.isFinite(numericScore)) return "—";

      const game = typeof gameOrUnit === "object" && gameOrUnit !== null ? gameOrUnit : null;
      const slug = cleanText(game?.slug) || cleanText(game?.rankingSlug) || "";
      if (slug === "maron_hikou") {
        return maronHikouScoreText(numericScore);
      }
      if (slug === "uchikaeru") {
        return uchikaeruScoreText(numericScore);
      }

      const unit = game ? cleanText(game.scoreUnit) || "" : gameOrUnit || "";
      const scale = game && Number(game.scoreScale) > 0 ? Number(game.scoreScale) : 1;
      const decimals =
        game && Number.isInteger(Number(game.scoreDecimals))
          ? Number(game.scoreDecimals)
          : scale > 1
            ? 2
            : 0;
      const displayValue = numericScore / scale;
      const formatted =
        decimals > 0
          ? displayValue.toLocaleString("ja-JP", {
              minimumFractionDigits: decimals,
              maximumFractionDigits: decimals
            })
          : formatNumber(displayValue);

      return `${formatted}${unit}`;
    }

    function isTimeScoreGame(game) {
      return game?.scoreUnit === "秒";
    }

    function firstScoreLabel(game) {
      return cleanText(game?.firstScoreLabel) || (isTimeScoreGame(game) ? "初回タイム" : "初回スコア");
    }

    function bestScoreLabel(game) {
      const label = cleanText(game?.bestScoreLabel);
      if (label) return label;
      if (isTimeScoreGame(game)) return game.scoreOrder === "asc" ? "ベストタイム" : "最長記録";
      return "最高スコア";
    }

      return `${shareText}\n${url || "公開URL確認中"}`.trim();
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "0";
      textarea.style.opacity = "0";
      textarea.style.userSelect = "text";
      textarea.style.webkitUserSelect = "text";

      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      const ok = document.execCommand("copy");
      document.body.removeChild(textarea);

      if (!ok) throw new Error("copy failed");
    }

    async function shareItem(item) {
      const text = buildShareMessage(item);

      try {
        if (navigator.share && item.url) {
          await navigator.share({
            title: item.title,
            text
          });
          return;
        }

        await copyText(text);
        showToast("シェア文をコピーしました");
      } catch (error) {
        if (error && error.name === "AbortError") return;

        try {
          await copyText(text);
          showToast("シェア文をコピーしました");
        } catch (copyError) {
          showToast("コピーできませんでした");
        }
      }
    }

    function playButtonHtml(item) {
      if (!item.url) {
        return `<button class="button disabled" type="button" disabled>URL確認中</button>`;
      }
      return `<a class="button" href="${escapeHtml(item.url)}">遊ぶ</a>`;
    }

    function detailUrlFor(game) {
      const slug = cleanText(game.detailSlug) || cleanText(game.slug);
      return `/chameleonjp_lab/ranking.html?game=${encodeURIComponent(slug)}`;
    }

    function detailButtonHtml(game) {
      return `<a class="button secondary" href="${escapeHtml(detailUrlFor(game))}" id="detail-${escapeHtml(game.slug)}">詳細ランキングを見る</a>`;
    }

    function statsHtml(game) {
      const grouped = isGroupedGame(game);
      const playLabel = grouped ? "合計プレイ回数（合算）" : "合計プレイ回数";
      const playerLabel = grouped ? "参加人数（合算）" : "参加人数";
      return `
        <div class="stats" aria-label="${escapeHtml(game.title)}の集計">
          <div class="stat-box" id="plays-box-${escapeHtml(game.slug)}">
            <span class="stat-label">${escapeHtml(playLabel)}</span>
            <span class="stat-value" id="plays-${escapeHtml(game.slug)}">確認中</span>
          </div>
          <div class="stat-box" id="players-box-${escapeHtml(game.slug)}">
            <span class="stat-label">${escapeHtml(playerLabel)}</span>
            <span class="stat-value" id="players-${escapeHtml(game.slug)}">確認中</span>
          </div>
        </div>
      `;
    }

    function rankingHtml(game) {
      const isFirstRanking = game.topRanking === "first";
      const title = isFirstRanking ? `${firstScoreLabel(game)}ランキング` : `${bestScoreLabel(game)}ランキング`;
      const note = cleanText(game.difficultySummary) ? game.difficultySummary : "";

      return `
        <section class="ranking coming" id="ranking-section-${escapeHtml(game.slug)}" aria-label="${escapeHtml(game.title)}のランキング">
          <div class="ranking-head">
            <h3 class="ranking-title" id="ranking-title-${escapeHtml(game.slug)}">${escapeHtml(title)}</h3>
            <span class="ranking-note" id="ranking-note-${escapeHtml(game.slug)}">確認中</span>
          </div>
          ${note ? `<div class="ranking-sub" style="margin:0 0 10px;color:var(--text-muted);font-size:12px;">${escapeHtml(note)}</div>` : ""}
          <div class="ranking-list" id="ranking-${escapeHtml(game.slug)}">
            <div class="loading">ランキングデータを確認中です</div>
          </div>
        </section>
      `;
    }

    function renderCards() {
      gameListEl.innerHTML = GAMES.map((game) => {
        const rankingBadge = `<span class="badge soon" id="ranking-badge-${escapeHtml(game.slug)}">ランキング確認中</span>`;
        const difficultyBadge = cleanText(game.difficultySummary)
          ? `<span class="badge">${escapeHtml(game.difficultySummary)}</span>`
          : "";

        return `
          <article class="game-card" id="game-${escapeHtml(game.slug)}">
            <h2 class="game-title">
              <button
                class="accordion-toggle"
                type="button"
                data-accordion="${escapeHtml(game.slug)}"
                aria-expanded="false"
                aria-controls="content-${escapeHtml(game.slug)}"
              >
                <span class="accordion-title-text">${escapeHtml(game.title)}</span>
                <span class="accordion-icon" aria-hidden="true">⌄</span>
              </button>
            </h2>

            <div class="accordion-content" id="content-${escapeHtml(game.slug)}">
              <p class="game-description">${escapeHtml(game.description || "説明は準備中です。")}</p>
              <div class="badge-row">
                <span class="badge">公開済み</span>
                ${difficultyBadge}
                ${rankingBadge}
              </div>

              ${statsHtml(game)}

              <div class="actions">
                ${playButtonHtml(game)}
                <button class="button secondary" type="button" data-share="${escapeHtml(game.slug)}">シェア</button>
              </div>

              ${rankingHtml(game)}

              <div class="detail-link-wrap">
                ${detailButtonHtml(game)}
              </div>
            </div>
          </article>
        `;
      }).join("");

      document.querySelectorAll("[data-accordion]").forEach((button) => {
        button.addEventListener("click", () => {
          const slug = button.dataset.accordion;
          const card = document.getElementById(`game-${slug}`);
          const game = GAMES.find((item) => item.slug === slug);
          const isOpen = card.classList.contains("open");

          document.querySelectorAll(".game-card.open").forEach((openCard) => {
            openCard.classList.remove("open");
            const openButton = openCard.querySelector("[data-accordion]");
            if (openButton) openButton.setAttribute("aria-expanded", "false");
          });

          if (!isOpen) {
            card.classList.add("open");
            button.setAttribute("aria-expanded", "true");
            ensureGameDataLoaded(game);
          }
        });
      });

      document.querySelectorAll("[data-share]").forEach((button) => {
        button.addEventListener("click", () => {
          const item = GAMES.find((game) => game.slug === button.dataset.share);
          if (item) shareItem(item);
        });
      });
    }

    function updateGameCardLabels(game) {
      if (!game) return;
      const titleEl = document.getElementById(`ranking-title-${game.slug}`);
      if (!titleEl) return;

      const isFirstRanking = game.topRanking === "first";
      const title = isFirstRanking ? `${firstScoreLabel(game)}ランキング` : `${bestScoreLabel(game)}ランキング`;
      titleEl.textContent = title;
    }

    function setStatsComingSoon(game) {
      const playsEl = document.getElementById(`plays-${game.slug}`);
      const playersEl = document.getElementById(`players-${game.slug}`);
      const playsBox = document.getElementById(`plays-box-${game.slug}`);
      const playersBox = document.getElementById(`players-box-${game.slug}`);

      if (playsEl) {
        playsEl.textContent = "coming soon";
        playsEl.classList.add("coming");
      }
      if (playersEl) {
        playersEl.textContent = "coming soon";
        playersEl.classList.add("coming");
      }
      if (playsBox) playsBox.classList.add("coming");
      if (playersBox) playersBox.classList.add("coming");
    }

    async function loadStats(game) {
      const playsEl = document.getElementById(`plays-${game.slug}`);
      const playersEl = document.getElementById(`players-${game.slug}`);
      if (!playsEl || !playersEl) return false;

      const stats = await fetchGameStats(game);
      return applyStatsToCard(game, stats);
    }

    function setRankingComingSoon(game) {
      const rankingSection = document.getElementById(`ranking-section-${game.slug}`);
      const rankingEl = document.getElementById(`ranking-${game.slug}`);
      const rankingNote = document.getElementById(`ranking-note-${game.slug}`);
      const badge = document.getElementById(`ranking-badge-${game.slug}`);
      const detailButton = document.getElementById(`detail-${game.slug}`);

      if (rankingSection) rankingSection.classList.add("coming");
      if (rankingEl) rankingEl.innerHTML = `<div class="coming-soon">coming soon</div>`;
      if (rankingNote) rankingNote.textContent = "準備中";
      if (badge) {
        badge.textContent = "ランキング coming soon";
        badge.classList.remove("ready");
        badge.classList.add("soon");
      }
      if (detailButton) {
        detailButton.outerHTML = detailButtonHtml(game);
      }
    }

    function setRankingReady(game) {
      const rankingSection = document.getElementById(`ranking-section-${game.slug}`);
      const rankingNote = document.getElementById(`ranking-note-${game.slug}`);
      const badge = document.getElementById(`ranking-badge-${game.slug}`);
      const detailButton = document.getElementById(`detail-${game.slug}`);

      if (rankingSection) rankingSection.classList.remove("coming");
      if (rankingNote) rankingNote.textContent = "1〜3位";
      if (badge) {
        badge.textContent = "ランキング表示中";
        badge.classList.remove("soon");
        badge.classList.add("ready");
      }
      if (detailButton) {
        detailButton.outerHTML = detailButtonHtml(game);
      }
    }

    async function loadTopRanking(game) {
      const rankingEl = document.getElementById(`ranking-${game.slug}`);
      if (!rankingEl) return false;

      if (isKeyUnset) {
        setRankingComingSoon(game);
        return false;
      }

      await waitForSupabaseSetup();

      if (!supabaseClient) {
        setRankingComingSoon(game);
        return false;
      }

      const isFirstRanking = game.topRanking === "first";
      const functionName = isFirstRanking ? "get_first_try_ranking" : "get_best_score_ranking";
      try {
        const { data, error } = await supabaseClient.rpc(functionName, {
          p_game_slug: getRankingSlug(game),
          p_limit: 3
        });

        if (error) throw error;

        const visibleRows = Array.isArray(data) ? data : [];

        if (!visibleRows.length) {
          rankingEl.innerHTML = `<div class="empty">まだ記録がありません</div>`;
          setRankingReady(game);
          return false;
        }

        rankingEl.innerHTML = visibleRows.map((row) => {
          const score = isFirstRanking ? row.first_score : row.best_score;

          return `
            <div class="rank-row">
              <div class="rank-no">${escapeHtml(row.rank_no)}位</div>
              <div class="rank-name">${escapeHtml(row.display_name)}</div>
              <div class="rank-score">${escapeHtml(scoreText(score, game))}</div>
            </div>
          `;
        }).join("");

        setRankingReady(game);
        return true;
      } catch (error) {
        console.error(`${functionName} error:`, getRankingSlug(game), error);
        setRankingComingSoon(game);
        return false;
      }
    }

    async function ensureGameDataLoaded(game) {
      if (!game) return;
      if (loadedGameSlugs.has(game.slug) || loadingGameSlugs.has(game.slug)) return;

      loadingGameSlugs.add(game.slug);

      try {
        const hydratedGame = await loadGameMetadata(game);
        updateGameCardLabels(hydratedGame);

        const statsReady = await loadStats(hydratedGame);
        const rankingReady = await loadTopRanking(hydratedGame);

        if (statsReady && rankingReady) loadedGameSlugs.add(game.slug);
      } finally {
        loadingGameSlugs.delete(game.slug);
      }
    }

    function setupSupabase() {
      if (supabaseClient || isKeyUnset) return supabaseClient;

      supabaseClient =
        window.supabase && typeof window.supabase.createClient === "function"
          ? window.supabase.createClient(SUPABASE_URL, getSupabasePublishableKey())
          : null;

      if (!supabaseClient && !isKeyUnset) {
        libraryNoticeEl.style.display = "block";
      }

      return supabaseClient;
    }

    async function init() {
      if (isKeyUnset) keyNoticeEl.style.display = "block";
      await loadGamesFromSupabase();
      renderCards();
      setupSortControls();
      applySortStatus();
      scheduleLazyBannerLoad();
    }

    init();

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setupSupabase);
    } else {
      setupSupabase();
    }
  </script>
</body>
</html>
