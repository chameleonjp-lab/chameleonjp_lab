  <main class="page">
    <div class="masthead">
      <div class="wordmark" lang="en" translate="no"><span class="brand-mark" aria-hidden="true"></span>ChameleonJP Lab</div>
      <div data-lab-toolbar>
        <button id="labSound" type="button" class="lab-sound-toggle" aria-pressed="true" hidden><span aria-hidden="true">🔊</span> <span class="sound-label">音</span></button>
      </div>
    </div>
    <header class="hero">
      <div class="hero-copy">
        <h1>カメレオンJPの実験場</h1>
        <p>園内マップから、遊びたいゲームを探そう。</p>
      </div>
      <div class="park-map" role="group" aria-label="園内マップ">
        <img class="hero-art" src="park-map.webp" width="1440" height="960" alt="" fetchpriority="high" />
        <button class="map-pin action" data-area="action" data-lab-cue="action" aria-pressed="false" disabled><i aria-hidden="true">ϟ</i><span>アクション</span></button>

      </div>
    </header>

    <section id="keyNotice" class="notice">
      プレイ回数と参加人数を読み込めません。
    </section>

    <section id="libraryNotice" class="notice">
      一部のゲームの集計を読み込めません。
    </section>

    <section class="directory" aria-labelledby="directoryTitle">
      <div class="directory-head">
        <div class="directory-heading">
          <h2 id="directoryTitle" tabindex="-1">公開中ゲーム</h2>
          <output class="game-count" id="gameCount" for="gameSearch" aria-live="polite" hidden></output>
        </div>
        <div class="sort-row">
          <label class="sort-label" for="gameSortSelect">並び替え</label>
          <select class="sort-select" id="gameSortSelect" autocomplete="off">
            <option value="newest" selected>最近追加された順</option>
            <option value="added">追加順</option>
            <option value="plays_desc">プレイ回数の多い順</option>
            <option value="plays_asc">プレイ回数の少ない順</option>
            <option value="players_desc">プレイ人数の多い順</option>
            <option value="players_asc">プレイ人数の少ない順</option>
          </select>
        </div>
      </div>
      <div class="finder">
        <label class="search-field"><i aria-hidden="true"></i><input id="gameSearch" type="search" aria-label="ゲームを検索" placeholder="ゲーム名・遊び方で検索" autocomplete="off" /></label>
        <button type="button" id="clearFilters" data-lab-cue="setting" hidden>すべて表示</button>
      </div>
      <p class="empty-results" id="emptyResults" hidden>条件に合うゲームがありません。</p>
      <div class="sort-status" id="sortStatus" aria-live="polite">最近追加された順で表示しています。</div>
      <div id="gameList" class="game-list" aria-label="ゲーム一覧"></div>
    </section>

    <section class="supporter-area" aria-label="協賛者">
      <h2 class="section-title">協賛者</h2>
      <section id="supporterList" class="game-list">
        <article class="diagnosis-banner-card" id="diagnosis-banner-card">
          <a class="diagnosis-banner-link link-callout" href="https://chameleonjp-lab.github.io/chameleon-type-pages/" aria-label="カメレオン診断を開く">
            <img
              class="diagnosis-banner-img"
              id="diagnosisBannerImage"
              data-lazy-src="banner"

              width="2173"
              height="724"
              loading="lazy"

        </article>

          </div>
        </article>
      </section>
    </section>

    (function preventMobileBrowserGestures() {
      let lastTouchEnd = 0;

      document.addEventListener(
        "touchend",
        function (event) {
          const now = Date.now();
          const interactive =
            event.target &&
            event.target.closest &&
            event.target.closest(
              "a, button, select, .button, [data-accordion], [data-share]"
            );

          if (!interactive && now - lastTouchEnd <= 350) {
            event.preventDefault();
          }

          lastTouchEnd = now;
        },
        { passive: false }
      );

      document.addEventListener(
        "touchmove",
        function (event) {
          if (event.touches && event.touches.length > 1) {
            event.preventDefault();
          }
        },
        { passive: false }
      );

      ["gesturestart", "gesturechange", "gestureend"].forEach((eventName) => {
        document.addEventListener(
          eventName,
          function (event) {
            event.preventDefault();
          },
          { passive: false }
        );
      });

      document.addEventListener("dblclick", function (event) {
        event.preventDefault();
      });

      document.addEventListener("contextmenu", function (event) {
        const link =
          event.target &&
          event.target.closest &&
          event.target.closest("a[href]");

        if (link) return;

        event.preventDefault();
      });
    })();

    async function requestGameStats(name, args) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
        method: "POST",
        headers: { apikey: getSupabasePublishableKey(), "content-type": "application/json" },
        credentials: "omit",
        redirect: "error",
        body: JSON.stringify(args),
        signal: AbortSignal.timeout(SUPABASE_REST_TIMEOUT_MS)
      });
      if (!response.ok) throw new Error(`Stats request failed: HTTP ${response.status}`);
      return response.json();
    }

    const DEDICATED_STATS = new Map([
      ["ikagetto", "ikagetto_stats_v1"],
      ["junglegym_onigokko", "junglegym_stats_v1"],
      ["medjedshin_ha_mamotteru", "medjed_stats_v1"],

    ]);

    async function fetchSingleGameStats(slug) {
      const normalizedSlug = cleanText(slug);
      if (!normalizedSlug) return { totalPlayCount: 0, playerCount: 0 };
      if (normalizedSlug === "chameleol") {
        try {
          const { reader } = await import("./chameleol-ranking.js?v=20261121-ta-v1");
          return await reader.stats();
        } catch { return null; }
      }
      if (singleStatsCache.has(normalizedSlug)) return singleStatsCache.get(normalizedSlug);
      if (DEDICATED_STATS.has(normalizedSlug)) {
        try {
          const data = await requestGameStats(DEDICATED_STATS.get(normalizedSlug), {});
          const row = Array.isArray(data) ? (data.length === 1 ? data[0] : null) : data;
          if (![row?.total_play_count, row?.player_count].every(value => Number.isSafeInteger(value) && value >= 0)) {
            return null;
          }
          const stats = normalizeStats(row);
          singleStatsCache.set(normalizedSlug, stats);
          return stats;
        } catch (error) {
          console.error("Game stats error:", error);
          return null;
        }
      }
      if (normalizedSlug === "inubo") {
        try {
          const { inuboStats } = await import("./inubo-data.js");
          const stats = normalizeStats(await inuboStats());
          singleStatsCache.set(normalizedSlug, stats);
          return stats;
        } catch {
          return null;
        }
      }
      await waitForSupabaseSetup();

      if (isKeyUnset || !supabaseClient) {
        return null;
      }

      try {
        const rpcName = normalizedSlug.startsWith("faitofuraito_")
          ? "get_faitofuraito_play_stats_v1"
          : "get_game_play_stats";
        const { data, error } = await supabaseClient.rpc(rpcName, {
          p_game_slug: normalizedSlug
        });

        if (error) throw error;

        const row = Array.isArray(data) && data.length > 0 ? data[0] : null;
        const stats = normalizeStats(row);
        singleStatsCache.set(normalizedSlug, stats);
        return stats;
      } catch (error) {
        console.error("game stats error:", normalizedSlug, error);
        // Do not cache transport/RPC failures as a real zero. The next
        // accordion open must be able to retry the statistics request.
        return null;
      }
    }

    async function fetchGameStats(game) {
      if (!game) return { totalPlayCount: 0, playerCount: 0 };
      if (game.slug === "chameleol") return fetchSingleGameStats(game.slug);
      if (gameStatsCache.has(game.slug)) return gameStatsCache.get(game.slug);
      const slugs = getStatsSlugs(game);
      const statsList = await Promise.all(slugs.map((slug) => fetchSingleGameStats(slug)));
      if (statsList.some((item) => item === null)) return null;
      const stats = statsList.reduce(
        (total, item) => {
          total.totalPlayCount += Number(item?.totalPlayCount || 0);
          total.playerCount += Number(item?.playerCount || 0);
          return total;
        },
        { totalPlayCount: 0, playerCount: 0 }
      );

      gameStatsCache.set(game.slug, stats);
      return stats;
    }

    function applyStatsToCard(game, stats) {
      const playsEl = document.getElementById(`plays-${game.slug}`);

      if (!playsEl || !playersEl || !stats) return false;
      const players = game.slug === "chameleol" ? stats.clearerCount : stats.playerCount;
      playsEl.textContent = formatNumber(stats.totalPlayCount) + "回";
      playersEl.textContent = formatNumber(players) + "人";
      return true;
    }

        statsSortPromise = null;

      return statsSortPromise;
    }

      const image = document.getElementById("diagnosisBannerImage");
      if (!image) return;

      const start = () => {
        const loadImage = () => {
          const src = image.dataset.lazySrc;
          if (!src || image.getAttribute("src")) return;

          image.addEventListener(
            "load",
            () => {
              image.classList.add("loaded");
            },
            { once: true }
          );
          image.setAttribute("src", src);
        };

        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(loadImage, { timeout: 1800 });
        } else {
          window.setTimeout(loadImage, 900);
        }
      };

      if (document.readyState === "complete") {
        start();
      } else {
        window.addEventListener("load", start, { once: true });
      }
    }

    function withVerifiedPlayUrl(game) {
      const original = game.url;
      const url = VERIFIED_PLAY_URL_MOVES.get(original);
      if (!url) return game;

      // Match complete URL tokens, not an alias, an unrelated link, or a query variant.
      const shareText = typeof game.shareText === "string"
        ? game.shareText.replace(/https:\/\/[^\s<>"'、。！？（）]+/g, link => link === original ? url : link)
        : game.shareText;
      return { ...game, url, shareText };
    }

    function shareTextFor(row, title, description, url) {
      return cleanText(row?.share_text) || `${title || ""}\n${description || ""}\n${url || ""}`.trim();
    }

    function rowToGame(row) {
      const title = cleanText(row.title) || cleanText(row.game_slug) || "タイトル確認中";
      const description = cleanText(row.description) || "説明は準備中です。";
      const url = cleanText(row.game_url) || "";
      return {
        displayOrder: Number(row.display_order || 0),
        slug: cleanText(row.game_slug),
        title,
        url,
        description,
        isActive: row.is_active !== false,
        releaseDate: cleanText(row.release_date),
        shareText: shareTextFor(row, title, description, url)
      };
    }

    function buildGamesFromRows(rows) {
      const bySlug = new Map(rows.map((row) => [cleanText(row.game_slug), row]));
      const games = [];
      const used = new Set();

      rows.forEach((row) => {
        const slug = cleanText(row.game_slug);
        if (!slug || used.has(slug)) return;

        if (slug === "faitofuraito_normal" || slug === "faitofuraito_easy") {
          const normal = bySlug.get("faitofuraito_normal") || row;
          const base = rowToGame(normal);
          games.push({
            ...base,
            slug: "faitofuraito",
            title: "ファイトフライト",
            detailSlug: "faitofuraito",
            rankingSlug: "faitofuraito_normal",
            statsSlugs: ["faitofuraito_normal", "faitofuraito_easy"]
          });
          used.add("faitofuraito_normal");
          used.add("faitofuraito_easy");
          return;
        }

        if (slug === "meoshi_wo_seisu_normal" || slug === "meoshi_wo_seisu_hard") {
          const normal = bySlug.get("meoshi_wo_seisu_normal");
          const hard = bySlug.get("meoshi_wo_seisu_hard") || row;
          const base = rowToGame(hard);
          games.push({
            ...base,
            slug: "meoshi_wo_seisu",
            title: "目押しを制す",
            description: cleanText(normal?.description) || base.description,
            detailSlug: "meoshi_wo_seisu",
            rankingSlug: "meoshi_wo_seisu_hard",
            statsSlugs: ["meoshi_wo_seisu_normal", "meoshi_wo_seisu_hard"]
          });
          used.add("meoshi_wo_seisu_normal");
          used.add("meoshi_wo_seisu_hard");
          return;
        }

        if (slug === "machigai_mikke_easy" || slug === "machigai_mikke_hard" || slug === "machigai_mikke_super_hard") {
          const easy = bySlug.get("machigai_mikke_easy");
          const superHard = bySlug.get("machigai_mikke_super_hard") || row;
          const base = rowToGame(superHard);
          games.push({
            ...base,
            slug: "machigai_mikke",
            title: "間違いみっけ",
            description: cleanText(easy?.description) || base.description,
            detailSlug: "machigai_mikke",
            rankingSlug: "machigai_mikke_super_hard",
            statsSlugs: ["machigai_mikke_easy", "machigai_mikke_hard", "machigai_mikke_super_hard"]
          });
          used.add("machigai_mikke_easy");
          used.add("machigai_mikke_hard");
          used.add("machigai_mikke_super_hard");
          return;
        }

        games.push(rowToGame(row));
        used.add(slug);
      });

      return games;
    }

    const GAME_SELECT_COLUMNS = "display_order, game_slug, title, game_url, description, is_active, release_date";
    const GAME_SELECT_COLUMNS_WITH_SHARE_TEXT = `${GAME_SELECT_COLUMNS}, share_text`;

    const SUPABASE_REST_TIMEOUT_MS = 8000;

    async function fetchActiveGamesCatalogViaRest() {
      const fetchImpl =
        typeof globalThis.fetch === "function" ? globalThis.fetch.bind(globalThis) : null;

      if (!fetchImpl) {
        return {
          data: null,
          error: new Error("REST fallback is unavailable")
        };
      }

      const params = new URLSearchParams();
      params.set("select", GAME_SELECT_COLUMNS_WITH_SHARE_TEXT);
      params.set("is_active", "eq.true");
      params.set("order", "display_order.asc");

      const controller =
        typeof AbortController === "function" ? new AbortController() : null;
      const timeoutId = controller
        ? window.setTimeout(() => controller.abort(), SUPABASE_REST_TIMEOUT_MS)
        : null;

      try {
        const response = await fetchImpl(
          `${SUPABASE_URL}/rest/v1/games?${params.toString()}`,
          {
            headers: {
              apikey: getSupabasePublishableKey(),
              Authorization: `Bearer ${getSupabasePublishableKey()}`,
              Accept: "application/json"
            },
            signal: controller?.signal
          }
        );

        if (!response.ok) {
          throw new Error(`REST catalog request failed: HTTP ${response.status}`);
        }

        const data = await response.json();
        if (!Array.isArray(data)) {
          throw new Error("REST catalog response is not an array");
        }

        return { data, error: null };
      } catch (error) {
        console.warn("games catalog REST fallback failed:", error);
        return { data: null, error };
      } finally {
        if (timeoutId !== null) window.clearTimeout(timeoutId);
      }
    }

    async function fetchActiveGamesCatalog() {
      if (!supabaseClient) {
        return fetchActiveGamesCatalogViaRest();
      }

      const runSelect = (columns) => supabaseClient
        .from("games")
        .select(columns)
        .eq("is_active", true)
        .order("display_order", { ascending: true });

      const firstResult = await runSelect(GAME_SELECT_COLUMNS_WITH_SHARE_TEXT);
      if (!firstResult.error) return firstResult;

      console.warn("games catalog load with share_text failed; retrying without share_text:", firstResult.error);
      const retryResult = await runSelect(GAME_SELECT_COLUMNS);
      if (!retryResult.error) return retryResult;

      console.warn("games catalog load without share_text also failed; retrying with REST:", retryResult.error);
      return fetchActiveGamesCatalogViaRest();
    }

    async function loadGamesFromSupabase() {
      if (isKeyUnset) return;
      await waitForSupabaseSetup();

      try {
        const { data, error } = await fetchActiveGamesCatalog();

        if (error) throw error;
        if (!Array.isArray(data)) return;

        GAMES = buildGamesFromRows(data).map(withVerifiedPlayUrl);
        assignAddedOrder();
        hasLiveGamesCatalog = true;
      } catch (error) {
        hasLiveGamesCatalog = false;
        console.warn("games catalog load failed; using fallback GAMES:", error);
      }
    }

        .replaceAll("'", "&#039;");

    function buildShareMessage(item) {
      let shareText = cleanText(item.shareText) || `${item.title || ""}\n${item.description || ""}`.trim();
      if ((item.slug === "ikagetto" || item.slug === "songen_wo_kakeyouka3_online" || item.slug === "galaxy_shark") && window.LabI18n) {
        shareText = shareText.split("\n").map(line => window.LabI18n.t(line)).join("\n");
      }
      const url = cleanText(item.url);
      if (url && shareText.includes(url)) {
        return shareText;

      return `${shareText}\n${url || "公開URL確認中"}`.trim();

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "0";
      textarea.style.opacity = "0";
      textarea.style.userSelect = "text";
      textarea.style.webkitUserSelect = "text";

      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      const ok = document.execCommand("copy");
      document.body.removeChild(textarea);

      if (!ok) throw new Error("copy failed");
    }

    async function shareItem(item) {
      const text = buildShareMessage(item);

      try {
        if (navigator.share && item.url) {
          await navigator.share({
            title: item.title,
            text
          });
          return;
        }

        await copyText(text);
        showToast("シェア文をコピーしました");
      } catch (error) {
        if (error && error.name === "AbortError") return;

        try {
          await copyText(text);
          showToast("シェア文をコピーしました");
        } catch (copyError) {
          showToast("コピーできませんでした");
        }
      }
    }

      const thumbnailPath = thumbnailPathFor(game.url);

      image.alt = game.title;

      content.prepend(link);

          continue;

        for (const columns of [2, 3, 4]) card.style.setProperty(`--col-${columns}`, visible % columns);

      const count = document.getElementById("gameCount");
      count.textContent = String(visible);

      directoryTitle.textContent = selectedArea ? areas[selectedArea].label : "公開中ゲーム";

        const card = document.getElementById(`game-${game.slug}`);
        if (card) card.searchText = searchKey([game.title, game.description, translate(game.title),
          translate(game.description || ""), game.slug].join(" "));
      }
      applyDirectoryFilters();
    }

    function setupParkMap() {
      gameListEl.addEventListener("error", event => {
        if (event.target.matches?.(".live-cover")) event.target.hidden = true;
      }, true);
      document.querySelectorAll(".map-pin").forEach(pin => {
        pin.disabled = !gameListEl.querySelector(`[data-area="${pin.dataset.area}"]`);
        pin.addEventListener("click", () => {
          selectedArea = selectedArea === pin.dataset.area ? "" : pin.dataset.area;
          searchInput.value = "";
          applyDirectoryFilters();
          directoryTitle.focus({ preventScroll: true });
          directoryTitle.scrollIntoView({ block: "start" });
        });
      });
      searchInput.addEventListener("input", applyDirectoryFilters);
      clearFilters.addEventListener("click", () => {
        selectedArea = "";
        searchInput.value = "";
        applyDirectoryFilters();
        directoryTitle.focus({ preventScroll: true });
      });
      document.addEventListener("lab-language-change", indexSearchText);
      indexSearchText();
    }

    function renderCards() {
      const games = getSortedGames();
      gameListEl.innerHTML = games.map((game) => {
        const art = artworkFor(game);
        const area = areaByGame.get(art.key) || "";
        const date = /^\d{4}-\d{2}-\d{2}$/.test(game.releaseDate) ? game.releaseDate : "";
        return `
          <article class="game-card" id="game-${escapeHtml(game.slug)}" data-area="${area}">
            <h2 class="game-title">
              <button
                class="accordion-toggle"
                type="button"
                data-accordion="${escapeHtml(game.slug)}"
                aria-labelledby="title-${escapeHtml(game.slug)}"
                aria-expanded="false"
                aria-controls="content-${escapeHtml(game.slug)}"
              >
                ${posterHtml(game, art)}
                <span class="game-caption">
                  <span class="ticket-meta">${area ? `<span class="area-label"><i aria-hidden="true">${areas[area].symbol}</i><span>${areas[area].label}</span></span>` : ""}</span>
                  <span class="accordion-title-text" id="title-${escapeHtml(game.slug)}">${escapeHtml(game.title)}</span>
                  ${date ? `<time class="release-date" datetime="${date}">${date.replaceAll("-", ".")}</time>` : ""}
                </span>
                <span class="accordion-icon" aria-hidden="true"></span>
              </button>
            </h2>

            <div class="accordion-content" id="content-${escapeHtml(game.slug)}">
              <p class="game-description">${escapeHtml(game.description || "説明は準備中です。")}</p>
              ${statsHtml(game)}

              <div class="actions">
                ${playButtonHtml(game)}
                <div class="detail-link-wrap">${detailButtonHtml(game)}</div>
                <button class="button secondary share-button" type="button" data-share="${escapeHtml(game.slug)}">シェア</button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      document.querySelectorAll("[data-accordion]").forEach((button) => {
        button.addEventListener("click", () => {
          const slug = button.dataset.accordion;
          const card = document.getElementById(`game-${slug}`);
          const game = GAMES.find((item) => item.slug === slug);
          const isOpen = card.classList.contains("open");
          const titleTop = button.getBoundingClientRect().top;

          document.querySelectorAll(".game-card.open").forEach((openCard) => {
            openCard.classList.remove("open");
            const openButton = openCard.querySelector("[data-accordion]");
            if (openButton) openButton.setAttribute("aria-expanded", "false");
          });

          if (!isOpen) {
            card.classList.add("open");
            button.setAttribute("aria-expanded", "true");
          }

          // Closing a card above can move the clicked title. Keep it at its current screen position.
          const titleShift = button.getBoundingClientRect().top - titleTop;
          if (Math.abs(titleShift) >= 1) window.scrollBy({ top: titleShift, behavior: "instant" });

          if (!isOpen) {
            loadGameThumbnail(card, game);
            ensureGameDataLoaded(game);
          }
        });
      });

      document.querySelectorAll("[data-share]").forEach((button) => {
        button.addEventListener("click", () => {
          const item = GAMES.find((game) => game.slug === button.dataset.share);
          if (item) shareItem(item);
        });
      });
    }

    async function loadStats(game) {
      const playsEl = document.getElementById(`plays-${game.slug}`);
      const playersEl = document.getElementById(`players-${game.slug}`);
      if (!playsEl || !playersEl) return false;

      const stats = await fetchGameStats(game);
      if (game.slug === "chameleol" && !stats) {
        const { showRetry } = await import("./chameleol-ranking.js?v=20261121-ta-v1");
        showRetry(playsEl, () => loadStats(game));
        playersEl.textContent = "取得できませんでした";
        return null;
      }
      if (!stats) {
        playsEl.textContent = playersEl.textContent = "取得できませんでした";
        return null;
      }
      applyStatsToCard(game, stats);
      return stats;
    }

    async function ensureGameDataLoaded(game) {
      if (!game) return;
      if (loadedGameSlugs.has(game.slug) || loadingGameSlugs.has(game.slug)) return;

      loadingGameSlugs.add(game.slug);

      try {
        const stats = await loadStats(game);
        if (stats && game.slug !== "chameleol") loadedGameSlugs.add(game.slug);
      } finally {
        loadingGameSlugs.delete(game.slug);
      }
    }

    function setupSupabase() {
      if (supabaseClient || isKeyUnset) return supabaseClient;

      supabaseClient =
        window.supabase && typeof window.supabase.createClient === "function"
          ? window.supabase.createClient(SUPABASE_URL, getSupabasePublishableKey())
          : null;

      if (!supabaseClient && !isKeyUnset) {
        libraryNoticeEl.style.display = "block";
      }

      return supabaseClient;
    }

    async function init() {
      GAMES = GAMES.map(withVerifiedPlayUrl);
      if (isKeyUnset) keyNoticeEl.style.display = "block";
      await loadGamesFromSupabase();
      renderCards();
      setupParkMap();
      setupSortControls();
      applySortStatus();
      scheduleLazyBannerLoad();
    }

    init();

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setupSupabase);
    } else {
      setupSupabase();
    }
  </script>
</body>
</html>
