    (function preventMobileBrowserGestures() {
      let lastTouchEnd = 0;

      document.addEventListener(
        "touchend",
        function (event) {
          const now = Date.now();
          const interactive =
            event.target &&
            event.target.closest &&
            event.target.closest(
              "a, button, .button, [data-ranking-tab], [data-difficulty-tab]"
            );

          if (!interactive && now - lastTouchEnd <= 350) {
            event.preventDefault();
          }

          lastTouchEnd = now;
        },
        { passive: false }
      );

      document.addEventListener(
        "touchmove",
        function (event) {
          if (event.touches && event.touches.length > 1) {
            event.preventDefault();
          }
        },
        { passive: false }
      );

      ["gesturestart", "gesturechange", "gestureend"].forEach((eventName) => {
        document.addEventListener(
          eventName,
          function (event) {
            event.preventDefault();
          },
          { passive: false }
        );
      });

      document.addEventListener("dblclick", function (event) {
        event.preventDefault();
      });

      document.addEventListener("contextmenu", function (event) {
        const link =
          event.target &&
          event.target.closest &&
          event.target.closest("a[href]");

        if (link) return;
        event.preventDefault();
      });
    })();

    function getSupabasePublishableKey() {
      return String(SUPABASE_PUBLISHABLE_KEY || "").trim();
    }

    function hasSupabasePublishableKey() {
      const key = getSupabasePublishableKey();
      return Boolean(
        key &&
        key.length > 20 &&
        !key.includes("ここに") &&
        !/YOUR|PASTE|PLACEHOLDER|PUBLISHABLE KEY/i.test(key)
      );
    }

    const isKeyUnset = !hasSupabasePublishableKey();
    let supabaseClient = null;
    let currentLoadToken = 0;

    const pageTitleEl = document.getElementById("pageTitle");
    const pageLeadEl = document.getElementById("pageLead");
    const keyNoticeEl = document.getElementById("keyNotice");
    const libraryNoticeEl = document.getElementById("libraryNotice");
    const contentAreaEl = document.getElementById("contentArea");
    const toastEl = document.getElementById("toast");

    function cleanText(value) {
      if (value === null || value === undefined) return undefined;
      const text = String(value).trim();
      if (!text || text.toLowerCase() === "null") return undefined;
      return text;
    }


    function setupSupabase() {
      if (supabaseClient || isKeyUnset) return supabaseClient;

      supabaseClient =
        window.supabase && typeof window.supabase.createClient === "function"
          ? window.supabase.createClient(SUPABASE_URL, getSupabasePublishableKey())
          : null;

      if (!supabaseClient && !isKeyUnset) {
        libraryNoticeEl.style.display = "block";
      }

      return supabaseClient;
    }

    async function waitForSupabaseSetup() {
      if (isKeyUnset || supabaseClient) return supabaseClient;

      if (document.readyState === "loading") {
        await new Promise((resolve) => {
          document.addEventListener("DOMContentLoaded", resolve, { once: true });
        });
      } else {
        await new Promise((resolve) => window.setTimeout(resolve, 0));
      }

      if (!supabaseClient) setupSupabase();
      return supabaseClient;
    }

    function normalizeGameMetadata(row) {
      if (!row) return {};
      const scoreScale = Number(row.score_scale || 1);
      const scoreDecimals = Number(row.score_decimals || 0);

      return {
        scoreOrder: cleanText(row.score_order),
        scoreUnit: cleanText(row.score_unit),
        scoreScale: Number.isFinite(scoreScale) && scoreScale > 0 ? scoreScale : 1,
        scoreDecimals: Number.isInteger(scoreDecimals) ? scoreDecimals : 0,
        scoreLabel: cleanText(row.score_label),
        firstScoreLabel: cleanText(row.first_score_label),
        bestScoreLabel: cleanText(row.best_score_label)
      };
    }

    const GAME_SELECT_COLUMNS = "display_order, game_slug, title, game_url, description, is_active, release_date, top_ranking_type, score_order, score_unit, score_scale, score_decimals, score_label, first_score_label, best_score_label";
    const GAME_SELECT_COLUMNS_WITH_SHARE_TEXT = `${GAME_SELECT_COLUMNS}, share_text`;

    function shareTextFor(row, title, description, url) {
      return cleanText(row?.share_text) || `${title || ""}\n${description || ""}\n${url || ""}`.trim();
    }

    function rowToDifficulty(row) {
      const title = cleanText(row.title) || cleanText(row.game_slug) || "タイトル確認中";
      const description = cleanText(row.description) || "説明は準備中です。";
      const url = cleanText(row.game_url) || "";
      return {
        displayOrder: Number(row.display_order || 0),
        slug: cleanText(row.game_slug),
        title,
        url,
        description,
        isActive: row.is_active !== false,
        topRanking: cleanText(row.top_ranking_type) || "best",
        ...normalizeGameMetadata(row),
        releaseDate: cleanText(row.release_date),
        key: cleanText(row.game_slug),
        difficultyLabel: "",
        shareText: shareTextFor(row, title, description, url)
      };
    }

    function buildPageFromDifficulty(game) {
      return {
        pageSlug: game.slug,
        title: game.title,
        url: game.url,
        description: game.description,
        shareText: game.shareText,
        defaultDifficultyKey: game.key,
        difficulties: [game]
      };
    }

    async function fetchGameRow(slug) {
      if (isKeyUnset) return null;
      await waitForSupabaseSetup();
      if (!supabaseClient) return null;

      const runSelect = (columns) => supabaseClient
        .from("games")
        .select(columns)
        .eq("game_slug", slug)
        .eq("is_active", true)
        .maybeSingle();

      const firstResult = await runSelect(GAME_SELECT_COLUMNS_WITH_SHARE_TEXT);
      if (!firstResult.error) return firstResult.data || null;

      console.warn("game row load with share_text failed; retrying without share_text:", slug, firstResult.error);
      const retryResult = await runSelect(GAME_SELECT_COLUMNS);
      if (retryResult.error) throw retryResult.error;
      return retryResult.data || null;
    }

    function labelDifficulty(game, key, label) {
      return {
        ...game,
        key,
        difficultyLabel: label
      };
    }

    function buildGroupedPage(pageSlug, title, rows, difficultyDefs, defaultKey) {
      const rowBySlug = new Map(rows.filter(Boolean).map((row) => [cleanText(row.game_slug), row]));
      const difficulties = difficultyDefs
        .map((def) => {
          const row = rowBySlug.get(def.slug);
          return row ? labelDifficulty(rowToDifficulty(row), def.key, def.label) : null;
        })
        .filter(Boolean);

      if (!difficulties.length) return null;
      const defaultDifficulty = difficulties.find((game) => game.key === defaultKey) || difficulties[difficulties.length - 1];
      return {
        pageSlug,
        title,
        url: defaultDifficulty.url,
        description: defaultDifficulty.description,
        shareText: defaultDifficulty.shareText,
        defaultDifficultyKey: defaultDifficulty.key,
        difficulties
      };
    }

    async function resolveGroupedGameFromSupabase(requestedSlug, requestedDifficulty) {
      if (requestedSlug === "meoshi_wo_seisu") {
        const rows = await Promise.all([
          fetchGameRow("meoshi_wo_seisu_normal"),
          fetchGameRow("meoshi_wo_seisu_hard")
        ]);
        const page = buildGroupedPage("meoshi_wo_seisu", "目押しを制す", rows, [
          { slug: "meoshi_wo_seisu_normal", key: "normal", label: "ノーマル" },
          { slug: "meoshi_wo_seisu_hard", key: "hard", label: "ハード" }
        ], "hard");
        return page ? { page, difficulty: getDifficultyFromPage(page, requestedDifficulty, requestedSlug) } : null;
      }

      if (requestedSlug === "machigai_mikke") {
        const rows = await Promise.all([
          fetchGameRow("machigai_mikke_easy"),
          fetchGameRow("machigai_mikke_hard"),
          fetchGameRow("machigai_mikke_super_hard")
        ]);
        const page = buildGroupedPage("machigai_mikke", "間違いみっけ", rows, [
          { slug: "machigai_mikke_easy", key: "easy", label: "イージー" },
          { slug: "machigai_mikke_hard", key: "hard", label: "ハード" },
          { slug: "machigai_mikke_super_hard", key: "super_hard", label: "超ハード" }
        ], "super_hard");
        return page ? { page, difficulty: getDifficultyFromPage(page, requestedDifficulty, requestedSlug) } : null;
      }

      return null;
    }

    async function resolveGameFromSupabase(requestedSlug, requestedDifficulty) {
      const grouped = await resolveGroupedGameFromSupabase(requestedSlug, requestedDifficulty);
      if (grouped) return grouped;

      const row = await fetchGameRow(requestedSlug);
      if (!row) return null;
      const game = rowToDifficulty(row);
      return { page: buildPageFromDifficulty(game), difficulty: game };
    }

    async function loadGameMetadata(game) {
      if (!game) return null;

      const fallback = {
        ...game,
        scoreScale: Number(game.scoreScale || 1),
        scoreDecimals: Number(game.scoreDecimals || 0)
      };

      if (isKeyUnset) return fallback;

      await waitForSupabaseSetup();

      if (!supabaseClient) return fallback;

      try {
        const { data, error } = await supabaseClient
          .from("games")
          .select("game_slug, score_order, score_unit, score_scale, score_decimals, score_label, first_score_label, best_score_label")
          .eq("game_slug", game.slug)
          .eq("is_active", true)
          .maybeSingle();

        if (error || !data) {
          if (error) console.warn("games metadata load error:", error);
          return fallback;
        }

        return {
          ...fallback,
          ...normalizeGameMetadata(data)
        };
      } catch (error) {
        console.warn("games metadata load failed:", error);
        return fallback;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatNumber(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return "0";
      return num.toLocaleString("ja-JP");
    }

    function maronHikouScoreText(numericScore) {
      const waveCode = Math.floor(numericScore / 10000000);
      const subScore = numericScore % 10000000;
      if (waveCode >= 31) {
        return `30波突破 / ${formatNumber(subScore)}点`;
      }
      return `${formatNumber(waveCode)}波到達 / ${formatNumber(subScore)}点`;
    }

    function uchikaeruScoreText(numericScore) {
      const clearWave = Math.floor(numericScore / 1000000);
      const detailScore = numericScore % 1000000;
      return `${formatNumber(clearWave)}波クリア / ${formatNumber(detailScore)}点`;
    }

    function scoreText(score, gameOrUnit) {
      if (score === null || score === undefined || score === "") return "—";

      const numericScore = Number(score);
      if (!Number.isFinite(numericScore)) return "—";

      const game = typeof gameOrUnit === "object" && gameOrUnit !== null ? gameOrUnit : null;
      const slug = cleanText(game?.slug) || cleanText(game?.rankingSlug) || "";
      if (slug === "maron_hikou") {
        return maronHikouScoreText(numericScore);
      }
      if (slug === "uchikaeru") {
        return uchikaeruScoreText(numericScore);
      }

      const unit = game ? cleanText(game.scoreUnit) || "" : gameOrUnit || "";
      const scale = game && Number(game.scoreScale) > 0 ? Number(game.scoreScale) : 1;
      const decimals =
        game && Number.isInteger(Number(game.scoreDecimals))
          ? Number(game.scoreDecimals)
          : scale > 1
            ? 2
            : 0;
      const displayValue = numericScore / scale;
      const formatted =
        decimals > 0
          ? displayValue.toLocaleString("ja-JP", {
              minimumFractionDigits: decimals,
              maximumFractionDigits: decimals
            })
          : formatNumber(displayValue);

      return `${formatted}${unit}`;
    }

    function isTimeScoreGame(game) {
      return game?.scoreUnit === "秒";
    }

    function firstScoreLabel(game) {
      return cleanText(game?.firstScoreLabel) || (isTimeScoreGame(game) ? "初回タイム" : "初回スコア");
    }

    function bestScoreLabel(game) {
      const label = cleanText(game?.bestScoreLabel);
      if (label) return label;
      if (isTimeScoreGame(game)) return game.scoreOrder === "asc" ? "ベストタイム" : "最長記録";
      return "最高スコア";
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");

      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2400);
    }

    function buildShareMessage(page) {
      return `${page.shareText || `${page.title}で遊んでみて！`}
${page.url || "公開URL確認中"}`;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      textarea.style.top = "0";
      textarea.style.opacity = "0";
      textarea.style.userSelect = "text";
      textarea.style.webkitUserSelect = "text";

      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      const ok = document.execCommand("copy");
      document.body.removeChild(textarea);

      if (!ok) throw new Error("copy failed");
    }

    async function shareGame(page) {
      const text = buildShareMessage(page);

      try {
        if (navigator.share && page.url) {
          await navigator.share({
            title: page.title,
            text
          });
          return;
        }

        await copyText(text);
        showToast("シェア文をコピーしました");
      } catch (error) {
        if (error && error.name === "AbortError") return;

        try {
          await copyText(text);
          showToast("シェア文をコピーしました");
        } catch (copyError) {
          showToast("コピーできませんでした");
        }
      }
    }

    function normalizeGameSlug(slug) {
      const value = cleanText(slug);
      if (!value) return "";
      const aliases = {
        anatano_1byo: "anatano_1byou",
        songen_o_kakeyouka: "songen_wo_kakeyouka",
        hito_o_yurusuna: "hito_wo_yurusuna",
        meoshi_wo_seisu_easy: "meoshi_wo_seisu_normal"
      };
      return aliases[value] || value;
    }

    function findPageBySlug(slug) {
      return GAME_PAGES.find((page) => page.pageSlug === slug || page.difficulties.some((game) => game.slug === slug));
    }

    function getDefaultDifficulty(page) {
      if (!page) return null;
      return page.difficulties.find((game) => game.key === page.defaultDifficultyKey) || page.difficulties[0] || null;
    }

    function getDifficultyFromPage(page, requestedDifficulty, requestedSlug) {
      if (!page) return null;
      const normalizedDifficulty = normalizeGameSlug(requestedDifficulty);
      const normalizedSlug = normalizeGameSlug(requestedSlug);

      return (
        page.difficulties.find((game) => game.key === normalizedDifficulty || game.slug === normalizedDifficulty) ||
        page.difficulties.find((game) => game.slug === normalizedSlug) ||
        getDefaultDifficulty(page)
      );
    }

    async function resolveGameFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const requestedSlug = normalizeGameSlug(params.get("game"));
      const requestedDifficulty = params.get("difficulty");

      try {
        const supabaseResolved = await resolveGameFromSupabase(requestedSlug, requestedDifficulty);
        if (supabaseResolved) return supabaseResolved;
      } catch (error) {
        console.warn("Supabase game resolve failed:", requestedSlug, error);
      }

      const page = findPageBySlug(requestedSlug);

      if (page) {
        return {
          page,
          difficulty: getDifficultyFromPage(page, requestedDifficulty, requestedSlug)
        };
      }

      return null;
    }

    function difficultyTabsHtml(page, selectedGame) {
      if (!page || !Array.isArray(page.difficulties) || page.difficulties.length <= 1) return "";

      return `
        <div class="ranking-switch" role="tablist" aria-label="難易度切り替え">
          ${page.difficulties.map((difficulty) => {

              <button
                class="ranking-tab${active ? " active" : ""}"

                role="tab"
                aria-selected="${active ? "true" : "false"}"
                data-difficulty-tab="${escapeHtml(difficulty.slug)}"
              >${escapeHtml(difficulty.difficultyLabel || difficulty.title)}</button>
            `;
          }).join("")}

      `;

              <span class="stat-label">合計プレイ回数</span>
              <span class="stat-value" id="totalPlayCount">読み込み中</span>
            </div>
            <div class="stat-box">
              <span class="stat-label">参加人数</span>
              <span class="stat-value" id="playerCount">読み込み中</span>
            </div>
          </div>

          <div class="actions">
            <a class="button link-callout" href="${escapeHtml(page.url)}">ゲームで遊ぶ</a>
            <button class="button secondary" type="button" id="shareButton">シェア</button>
          </div>

          ${difficultyTabsHtml(page, game)}

          <div class="ranking-switch" role="tablist" aria-label="ランキング切り替え">
            <button
              class="ranking-tab active"
              type="button"
              id="firstTab"
              role="tab"
              aria-selected="true"
              aria-controls="firstPanel"
              data-ranking-tab="first"
            >${escapeHtml(firstLabel)}</button>
            <button
              class="ranking-tab"
              type="button"
              id="bestTab"
              role="tab"
              aria-selected="false"
              aria-controls="bestPanel"
              data-ranking-tab="best"
            >${escapeHtml(bestLabel)}</button>
            <button
              class="ranking-tab"
              type="button"
              id="playsTab"
              role="tab"
              aria-selected="false"
              aria-controls="playsPanel"
              data-ranking-tab="plays"
            >プレイ回数</button>
          </div>
        </section>

        <section class="ranking-area">
          <section class="ranking-card" id="firstPanel" role="tabpanel" aria-labelledby="firstTab">
            <h2 class="ranking-title">${escapeHtml(firstLabel)}ランキング</h2>
            <p class="ranking-sub">初めて遊んだときの記録だけを表示します。</p>
            <div class="ranking-list" id="firstRanking">
              <div class="loading">${escapeHtml(firstLabel)}ランキングを読み込み中です</div>
            </div>
          </section>

          <section class="ranking-card" id="bestPanel" role="tabpanel" aria-labelledby="bestTab" hidden>
            <h2 class="ranking-title">${escapeHtml(bestLabel)}ランキング</h2>
            <p class="ranking-sub">これまでに出した一番良い記録だけを表示します。</p>
            <div class="ranking-list" id="bestRanking">
              <div class="loading">${escapeHtml(bestLabel)}ランキングを読み込み中です</div>
            </div>
          </section>

          <section class="ranking-card" id="playsPanel" role="tabpanel" aria-labelledby="playsTab" hidden>
            <h2 class="ranking-title">プレイ回数ランキング</h2>
            <p class="ranking-sub">プレイ回数が多い順に表示します。</p>
            <div class="ranking-list" id="playsRanking">
              <div class="loading">プレイ回数ランキングを読み込み中です</div>
            </div>
          </section>
        </section>

        <section class="ranking-card disqualified-card" id="disqualifiedSection" hidden>
          <h2 class="ranking-title">不正ユーザー</h2>
          <p class="ranking-sub">通常ランキングから除外された記録です。</p>
          <div class="ranking-list" id="disqualifiedRanking"></div>
        </section>

        <div class="bottom-actions">
          <a class="button secondary" href="/chameleonjp_lab/">トップページへ戻る</a>
        </div>
      `;

      document.getElementById("shareButton").addEventListener("click", () => {
        shareGame(page);
      });

      document.querySelectorAll("[data-ranking-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          switchRankingTab(button.dataset.rankingTab);
        });
      });

      document.querySelectorAll("[data-difficulty-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          const nextDifficulty = page.difficulties.find((item) => item.slug === button.dataset.difficultyTab);
          if (nextDifficulty) showGamePage(page, nextDifficulty);
        });
      });

      switchRankingTab(game.topRanking === "first" ? "first" : "best");
    }

    function switchRankingTab(tabName) {
      const tabs = ["first", "best", "plays"];
      const activeTab = tabs.includes(tabName) ? tabName : "first";

      tabs.forEach((name) => {
        const tab = document.getElementById(`${name}Tab`);
        const panel = document.getElementById(`${name}Panel`);
        const isActive = name === activeTab;
        if (tab) {
          tab.classList.toggle("active", isActive);
          tab.setAttribute("aria-selected", isActive ? "true" : "false");
        }
        if (panel) panel.hidden = !isActive;
      });
    }

    function setDetailStatsComingSoon(token) {
      if (token !== currentLoadToken) return;
      const totalPlayCountEl = document.getElementById("totalPlayCount");
      const playerCountEl = document.getElementById("playerCount");

      if (totalPlayCountEl) {
        totalPlayCountEl.textContent = "coming soon";
        totalPlayCountEl.classList.add("coming");
      }
      if (playerCountEl) {
        playerCountEl.textContent = "coming soon";
        playerCountEl.classList.add("coming");
      }
    }

    async function loadStats(game, token) {
      const totalPlayCountEl = document.getElementById("totalPlayCount");
      const playerCountEl = document.getElementById("playerCount");

      if (isKeyUnset) {
        setDetailStatsComingSoon(token);
        return;
      }

      await waitForSupabaseSetup();

      if (!supabaseClient) {
        setDetailStatsComingSoon(token);
        return;
      }

      try {
        const { data, error } = await supabaseClient.rpc("get_game_play_stats", {
          p_game_slug: game.slug
        });

        if (error) throw error;
        if (token !== currentLoadToken) return;

        const stats = Array.isArray(data) && data.length > 0 ? data[0] : null;
        const totalPlayCount = Number(stats?.total_play_count ?? 0);
        const playerCount = Number(stats?.player_count ?? 0);

        if (totalPlayCount <= 0 && playerCount <= 0) {
          setDetailStatsComingSoon(token);
          return;
        }

        totalPlayCountEl.textContent = `${formatNumber(totalPlayCount)}回`;
        playerCountEl.textContent = `${formatNumber(playerCount)}人`;
      } catch (error) {
        console.error("get_game_play_stats error:", game.slug, error);
        setDetailStatsComingSoon(token);
      }
    }

    async function fetchFirstRanking(game) {
      const { data, error } = await supabaseClient.rpc("get_first_try_ranking", {
        p_game_slug: game.slug,
        p_limit: DETAIL_LIMIT
      });

      if (error) throw error;
      return Array.isArray(data) ? data : [];
    }

    async function fetchBestRanking(game) {
      const { data, error } = await supabaseClient.rpc("get_best_score_ranking", {
        p_game_slug: game.slug,
        p_limit: DETAIL_LIMIT
      });

      if (error) throw error;
      return Array.isArray(data) ? data : [];
    }

    function buildFirstRankingRows(firstRows, game) {
      if (!firstRows.length) return `<div class="empty">まだ記録がありません</div>`;

      return firstRows.map((row) => `
        <div class="detail-row">
          <div class="detail-main">
            <div class="rank-no">${escapeHtml(row.rank_no)}位</div>
            <div class="player-name">${escapeHtml(row.display_name)}</div>
          </div>

          <div class="detail-grid single">
            <div class="mini-box primary-score first-score">
              <span class="mini-label">${escapeHtml(firstScoreLabel(game))}</span>
              <span class="mini-value">${escapeHtml(scoreText(row.first_score, game))}</span>
            </div>
          </div>
        </div>
      `).join("");
    }

    function buildBestRankingRows(bestRows, game) {
      if (!bestRows.length) return `<div class="empty">まだ記録がありません</div>`;

      return bestRows.map((row) => `
        <div class="detail-row">
          <div class="detail-main">
            <div class="rank-no">${escapeHtml(row.rank_no)}位</div>
            <div class="player-name">${escapeHtml(row.display_name)}</div>
          </div>

          <div class="detail-grid">
            <div class="mini-box primary-score best-score">
              <span class="mini-label">${escapeHtml(bestScoreLabel(game))}</span>
              <span class="mini-value">${escapeHtml(scoreText(row.best_score, game))}</span>
            </div>
            <div class="mini-box">
              <span class="mini-label">プレイ回数</span>
              <span class="mini-value">${escapeHtml(formatNumber(row.play_count))}回</span>
            </div>
          </div>
        </div>
      `).join("");
    }

    function buildDisqualifiedRows(rows, game) {
      if (!rows.length) return "";

      return rows.map((row) => {
        const note = cleanText(row.ranking_note) || "不正行為";
        return `
          <div class="detail-row cheat-row">
            <div class="detail-main">
              <div class="rank-no">${escapeHtml(note)}</div>
              <div class="player-name">${escapeHtml(row.display_name)}</div>
            </div>
            <div class="detail-grid">
              <div class="mini-box primary-score first-score">
                <span class="mini-label">${escapeHtml(firstScoreLabel(game))}</span>
                <span class="mini-value">${escapeHtml(scoreText(row.first_score, game))}</span>
              </div>
              <div class="mini-box primary-score best-score">
                <span class="mini-label">${escapeHtml(bestScoreLabel(game))}</span>
                <span class="mini-value">${escapeHtml(scoreText(row.best_score, game))}</span>
              </div>
              <div class="mini-box">
                <span class="mini-label">プレイ回数</span>
                <span class="mini-value">${escapeHtml(formatNumber(row.play_count))}回</span>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function fetchPlayCountRanking(game) {
      const { data, error } = await supabaseClient.rpc("get_play_count_ranking", {
        p_game_slug: game.slug,
        p_limit: DETAIL_LIMIT
      });

      if (error) throw error;
      return Array.isArray(data) ? data : [];
    }

    function buildPlayCountRankingRows(playRows, game) {
      if (!playRows.length) return `<div class="empty">まだ記録がありません</div>`;

      return playRows.map((row) => `
        <div class="detail-row">
          <div class="detail-main">
            <div class="rank-no">${escapeHtml(row.rank_no)}位</div>
            <div class="player-name">${escapeHtml(row.display_name)}</div>
          </div>

          <div class="detail-grid">
            <div class="mini-box primary-score best-score">
              <span class="mini-label">プレイ回数</span>
              <span class="mini-value">${escapeHtml(formatNumber(row.play_count))}回</span>
            </div>
            <div class="mini-box">
              <span class="mini-label">参考ベスト</span>
              <span class="mini-value">${escapeHtml(scoreText(row.best_score, game))}</span>
            </div>
          </div>
        </div>
      `).join("");
    }

    function showPlayCountRankingError(token) {
      if (token !== currentLoadToken) return;
      const playsRankingEl = document.getElementById("playsRanking");
      if (playsRankingEl) playsRankingEl.innerHTML = `<div class="coming-soon">プレイ回数ランキングを取得できませんでした。</div>`;
    }

    function showDetailComingSoon(token) {
      if (token !== currentLoadToken) return;
      const firstRankingEl = document.getElementById("firstRanking");
      const bestRankingEl = document.getElementById("bestRanking");
      const playsRankingEl = document.getElementById("playsRanking");

      if (firstRankingEl) firstRankingEl.innerHTML = `<div class="coming-soon">coming soon</div>`;
      if (bestRankingEl) bestRankingEl.innerHTML = `<div class="coming-soon">coming soon</div>`;
      if (playsRankingEl) playsRankingEl.innerHTML = `<div class="coming-soon">プレイ回数ランキングを取得できませんでした。</div>`;
    }

    async function loadRankings(game, token) {
      const firstRankingEl = document.getElementById("firstRanking");
      const bestRankingEl = document.getElementById("bestRanking");
      const playsRankingEl = document.getElementById("playsRanking");

      if (isKeyUnset) {
        showDetailComingSoon(token);
        return;
      }

      await waitForSupabaseSetup();

      if (!supabaseClient) {
        showDetailComingSoon(token);
        return;
      }

      try {
        const [firstRows, bestRows] = await Promise.all([
          fetchFirstRanking(game),
          fetchBestRanking(game)
        ]);

        if (token !== currentLoadToken) return;

        firstRankingEl.innerHTML = buildFirstRankingRows(firstRows, game);
        bestRankingEl.innerHTML = buildBestRankingRows(bestRows, game);
      } catch (error) {
        console.error("ranking load error:", game.slug, error);
        showDetailComingSoon(token);
      }

      try {
        const playRows = await fetchPlayCountRanking(game);
        if (token !== currentLoadToken) return;
        if (playsRankingEl) playsRankingEl.innerHTML = buildPlayCountRankingRows(playRows, game);
      } catch (error) {
        console.error("play count ranking load error:", game.slug, error);
        showPlayCountRankingError(token);
      }
    }


    async function loadDisqualifiedEntries(game, token) {
      const sectionEl = document.getElementById("disqualifiedSection");
      const rankingEl = document.getElementById("disqualifiedRanking");
      if (!sectionEl || !rankingEl) return;

      sectionEl.hidden = true;
      rankingEl.innerHTML = "";

      if (isKeyUnset) return;

      await waitForSupabaseSetup();
      if (!supabaseClient) return;

      try {
        const { data, error } = await supabaseClient.rpc("get_disqualified_score_entries", {
          p_game_slug: game.slug,
          p_limit: 50
        });

        if (error) throw error;
        if (token !== currentLoadToken) return;

        const rows = Array.isArray(data) ? data : [];
        if (!rows.length) return;

        rankingEl.innerHTML = buildDisqualifiedRows(rows, game);
        sectionEl.hidden = false;
      } catch (error) {
        console.error("disqualified entries load error:", game.slug, error);
        if (token !== currentLoadToken) return;
        rankingEl.innerHTML = `<div class="coming-soon">不正ユーザー欄を取得できませんでした。</div>`;
        sectionEl.hidden = false;
      }
    }

    async function showGamePage(page, baseGame) {
      const token = ++currentLoadToken;
      const hydratedGame = await loadGameMetadata(baseGame);
      if (token !== currentLoadToken) return;

      renderBase(page, hydratedGame);

      const url = new URL(window.location.href);
      url.searchParams.set("game", page.pageSlug);
      if (page.difficulties.length > 1) {
        url.searchParams.set("difficulty", hydratedGame.key);
      } else {
        url.searchParams.delete("difficulty");
      }
      window.history.replaceState(null, "", url.toString());

      loadStats(hydratedGame, token);
      loadRankings(hydratedGame, token);
      loadDisqualifiedEntries(hydratedGame, token);
    }

    async function init() {
      if (isKeyUnset) keyNoticeEl.style.display = "block";

      await waitForSupabaseSetup();

      const resolved = await resolveGameFromUrl();

      if (!resolved || !resolved.page || !resolved.difficulty) {
        renderNotFound();
        return;
      }

      showGamePage(resolved.page, resolved.difficulty);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
