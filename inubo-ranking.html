<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>イヌボー｜ランキング</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#173a35;background:#f6f0df}
    *{box-sizing:border-box}
    body{margin:0}
    main{max-width:40rem;margin:auto;padding:1.25rem}
    .hero{padding:clamp(18px,4vw,32px);margin:1.1rem 0;border-radius:16px;color:#fff9ed;background:linear-gradient(90deg,#102c2af2,#173c32c9 66%,#123b2e55),#143c32 url("arcade-at-dusk.webp") 75% 43%/cover}
    .hero h2{margin:.2rem 0 0}
    h1{margin:0;font-size:clamp(2rem,8vw,3.5rem)}
    nav,.tabs{display:flex;flex-wrap:wrap;gap:.5rem}
    button,a{font:inherit;display:inline-flex;align-items:center;min-height:44px;padding:.45rem .85rem;color:inherit;background:#fffcf6;border:1px solid #acb7a4;border-radius:.55rem;text-decoration:none}
    button{cursor:pointer}
    [hidden]{display:none}
    button[aria-pressed=true]{color:#fff;background:#165643;border-color:#165643;font-weight:700}
    h2{font-size:1.25rem}
    ol{margin:1rem 0;padding:0;list-style:none;background:#fffcf6;border-radius:.65rem}
    li{display:grid;grid-template-columns:minmax(2.5rem,auto) minmax(2rem,1fr) minmax(3rem,auto);gap:.65rem;padding:.65rem;border-bottom:1px solid #cbcbb3;overflow-wrap:anywhere}
    li strong{text-align:end}
  </style>
  <script defer src="./lab-audio.js?v=20261128-park"></script>
  <script type="module" src="./inubo-ranking.js?v=lab-card-1"></script>
</head>
<body>
<main>
  <nav>
    <a id="game" href="https://chameleonjp-lab.github.io/inubo/">イヌボー</a>
    <a id="lab" href="./" aria-label="ChameleonJP Lab">ChameleonJP Lab</a>
    <button id="labSound" type="button" class="lab-sound-toggle" aria-pressed="true" hidden><span aria-hidden="true">🔊</span> <span class="sound-label">音</span></button>
  </nav>
  <header class="hero">
    <h1 id="title">イヌボー</h1>
    <h2 id="heading">詳細ランキング</h2>
  </header>
  <div class="tabs" role="group" aria-labelledby="heading">
    <button id="total" type="button" aria-pressed="true">総合</button>
    <button id="time" type="button" aria-pressed="false">タイム</button>
  </div>
  <p id="status" role="status"></p>
  <ol id="rows" aria-labelledby="heading"></ol>
  <button id="retry" type="button" hidden>再試行</button>
</main>
</body>
</html>
